[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computeMCP-gateway"
version = "0.1.0"
description = "Secure gateway and MCP bridge giving Terok agents access to remote compute containers"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.20",
    "aiohttp>=3.10",
    "mcp>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
computeMCP-gateway = "compute_mcp.gateway:main"
computeMCP-mcp = "compute_mcp.mcp_server:main"
computeMCP-gatewayctl = "compute_mcp.control:main"
computeMCP-handshake = "compute_mcp.handshake:main"

[tool.setuptools.packages.find]
where = ["src"]

# The deployment bundles ship as package data so the gateway can upload the
# exact revision it was built from.  Without this, an installed wheel would
# have no bundle directory and auto-deploy would fail.
[tool.setuptools.package-data]
"compute_mcp.bundles" = [
    "computemcp-slurm/*.sh",
    "computemcp-slurm/*.py",
    "computemcp-slurm/README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
