# computeMCP gateway configuration.
#
# Copy to ~/.config/computeMCP-gateway/config.toml and edit.
# The gateway TOML is the single source of truth for targets.  Values here are
# never accepted from MCP clients.
#
# Replace every "/home/USER" placeholder with your real home directory.  A
# literal "USER" path parses fine but makes every exec/session fail with
# "[Errno 2] No such file or directory".
#
# ---------------------------------------------------------------------------
# Configuration includes (optional).
# A top-level `include` key splits the gateway configuration across files.
# Place it before any other table.  Relative paths resolve against the
# directory of this file, not the process working directory; absolute paths
# are used as-is.  Two files assigning the same leaf value are rejected (the
# error names both files); a missing include file or a cycle is a load error.
# `include` keys are stripped from the merged result, so an entry file that
# only carries `include` plus the tables below still loads as a normal config.
# ---------------------------------------------------------------------------
# include = [
#     "systems/rosi.toml",
#     "systems/hal.toml",
#     "/opt/computeMCP-gateway/systems/other.toml",
# ]

[server]
# Bind address. On the host that Terok/Podman reaches via
# host.containers.internal this is typically the host-side gateway address
# (e.g. 10.0.2.2 or 0.0.0.0 restricted by the Terok shield). Keep it loopback
# unless a container must reach it.
listen = "127.0.0.1"
port = 2222
request_timeout = 30.0
exec_timeout = 900.0
max_body_bytes = 268435456
# Interactive enrollment (computeMCP-handshake).  /v1/enroll is unauthenticated but
# grants nothing until an operator approves on the console; these bound it.
# Disabled by default: set allow_enrollment = true to expose the endpoint.
allow_enrollment = false
enroll_ttl = 600.0
enroll_max_pending = 32

[ssh]
connect_timeout = 10
server_alive_interval = 30
server_alive_count_max = 3
internal_port_min = 31000
internal_port_max = 31999
# Optional dedicated SSH config used by the tunnel subprocess.  Leave unset to
# use the gateway user's normal ~/.ssh/config.  Keeping a separate file lets the
# gateway own only the aliases it needs.
# config = "/home/USER/.config/computeMCP-gateway/ssh_config"

[sessions]
idle_timeout = 3600.0
max_per_client = 16
output_buffer_bytes = 4194304

[auth]
# Recommended: generate tokens and store only their hashes here.
#   computeMCP-gateway --generate-tokens
# Then uncomment the line below AND delete every inline `token = ...` in
# [clients.*].  If you do not set token_file, a tokens.toml next to this file is
# picked up automatically.  IMPORTANT: an inline `token` takes precedence over
# token_file.
# If you enable token_file but leave the example's inline
# `token = "REPLACE_WITH_..."`, the gateway authenticates against the
# placeholder hash and every client request fails with "invalid token".
# token_file = "/home/USER/.config/computeMCP-gateway/tokens.toml"

# ---------------------------------------------------------------------------
# Clients. Each Terok project gets a dedicated high-entropy token.  Prefer
# `--generate-tokens` + token_file (above); the inline `token` below exists only
# to bootstrap a quick test and is hashed on load.  Once you enable token_file,
# DELETE these inline tokens or they silently take precedence and every request
# fails with "invalid token".  Never reuse an SSH key or a GitHub token here.
# ---------------------------------------------------------------------------
[clients.alpaka]
token = "REPLACE_WITH_PROJECT_TOKEN"
targets = ["hal", "fwk394"]

[clients.admin]
token = "REPLACE_WITH_ADMIN_TOKEN"
targets = ["*"]

# ---------------------------------------------------------------------------
# Targets.  `ssh_targets` are aliases from the local user's SSH config, in
# priority order.  The gateway resolves each alias with `ssh -G` (host, user,
# port, identityfile, ProxyJump) and keeps the first working route.  A
# `proxycommand` (rather than a ProxyJump alias) is rejected with a clear error.
# Transport defaults to "tunnel" when ssh_targets is present, and "direct"
# otherwise.
# ---------------------------------------------------------------------------
[targets.hal]
ssh_targets = ["hal", "ex_hal"]
remote_host = "127.0.0.1"
remote_port = 2222
user = "agent"
# Mandatory for production: pin the development-container host key.  Because a
# tunnel maps an ephemeral local port to the container, a known_hosts file
# cannot reliably match; pin the fingerprint instead.  The pinned key is the
# sshd the gateway dials (remote_port, usually 2222) -- the CONTAINER's sshd,
# not the host's own sshd on port 22, and not a random Slurm compute-node key.
# Obtain it on the host via an alias that reaches the container:
#   ssh <alias> 'cat /etc/ssh/ssh_host_ed25519_key.pub' | ssh-keygen -lf - | awk '{print $2}'
#   ssh <alias> 'ssh-keyscan -t ed25519 -p 2222 127.0.0.1 2>/dev/null' | ssh-keygen -lf - | awk '{print $2}'
# An unqualified hostname in ~/.ssh/known_hosts means port 22, so its
# fingerprint is usually the wrong key; look for a "[host]:2222" entry.
# If the container offers several host-key algorithms, restrict negotiation to
# the one you pinned so the fingerprint always matches.
host_key_sha256 = "SHA256:REPLACE_WITH_CONTAINER_HOST_KEY_FINGERPRINT"
host_key_algorithms = ["ssh-ed25519"]
# Optional: pin the LOGIN node host key (the route connection), not the
# container key.  Unset falls back to the local ~/.ssh/known_hosts (previous
# behavior).  Distinct from host_key_sha256 above, which pins the CONTAINER.
# route_host_key_sha256 = "SHA256:REPLACE_WITH_LOGIN_NODE_HOST_KEY_FINGERPRINT"
# Host-key verification policy:
#   "on"  (default) require host_key_sha256 or known_hosts; refuse otherwise.
#   "off" disable verification and accept any host key.  Only safe when the
#         forwarded endpoint itself is trusted (single-user dev box); never on
#         a host where another user could hijack the forwarded port.
# With "off", host_key_algorithms (above) still restricts negotiated algorithms
# if set, but it does NOT verify the server's identity.
host_key_check = "on"
client_key = "/home/USER/.ssh/computemcp_container"
# "shared" (default) multiplexes all exec/sessions over one SSH connection.
# "dedicated" opens a fresh connection per exec/session, bypassing the remote
# sshd's per-connection MaxSessions limit (commonly 10) at the cost of more
# handshakes. Use "dedicated" for many simultaneous long-running sessions.
connect_mode = "shared"
# Is the underlying system dedicated to this task or shared with others?
#   "exclusive" - dedicated (e.g. a whole Slurm node/container); benchmarks
#                 are meaningful
#   "shared"    - other users/jobs may run concurrently; benchmarks are noisy
#   "unknown"   - not declared (default)
# Exposed to agents via computeMCP_targets()/computeMCP_status().
sharing = "unknown"
# Optional list of free-form, unstructured, AI-readable hints about the system.
# No fixed meaning or schema; agents treat them as starting hypotheses.  Unset
# or empty means no extra info: the agent discovers the system itself or the
# user guides it.  Exposed to agents via computeMCP_targets()/computeMCP_status().
# node_info = ["GPU nvidia", "x86 CPU", "AMD GPU"]
# Optional ordered list of remote AI agents this target can delegate to.  Each
# entry is an inline table with exactly `agent` and `model`, both non-empty
# strings (spaces allowed).  The list order is the priority order; the caller
# should try the entries in order and fall back to the first working one.
# Empty = no remote agent.  Unrelated to the SSH `user = "agent"` account name.
# Exposed to agents via computeMCP_targets()/computeMCP_status().
# agent = [{ agent = "opencode", model = "GWen 3.5" }, { agent = "codex", model = "Sole" }]
# Set true if the LOGIN/ROUTE connection requires a second factor instead of
# accepting the key alone.  The factor can be a one-time password
# (keyboard-interactive/OTP), a password, or the passphrase of the SSH client
# key; it is supplied per request with `--2fa SECRET` on
# `target-connect`/`target-refresh` (or the console `connect`/`refresh`) and is
# never persisted or logged.  interactive_auth overrides and ignores
# auto_connect: such a target does NOT connect at startup or on config reload.
# A request without --2fa logs a warning and changes nothing.  The container hop
# stays key-based.
interactive_auth = false
# Start this target automatically at gateway startup and on config reload.
# Ignored when interactive_auth = true.
auto_connect = true
connect_backoff_initial = 1.0
connect_backoff_max = 60.0

# --- HPC target: Slurm compute node behind a fixed login node --------------
# The login node (e.g. rosi5) is fixed; the compute node and the container's
# forwarded port are produced by Slurm, so they are discovered at connect time
# by a trusted provisioning command.  Both hops use the gateway user's keys.
#
# [targets.rosi5]
# user = "agent"
# client_key = "/home/USER/.ssh/computemcp_container"
# host_key_sha256 = "SHA256:REPLACE_WITH_CONTAINER_HOST_KEY_FINGERPRINT"
# host_key_algorithms = ["ssh-ed25519"]
# # Optional: pin the login node host key; unset uses ~/.ssh/known_hosts.
# # route_host_key_sha256 = "SHA256:REPLACE_WITH_LOGIN_NODE_HOST_KEY_FINGERPRINT"
# # Gateway reaches the login node via this SSH config alias.
# ssh_targets = ["rosi5"]
# # Optional: jump through another alias (dialed first, then the route alias).
# proxy_jump = "rosi5"
# # Trusted argv (no shell).  It runs ON the login node over the authenticated
# # route connection (not as a local subprocess), starts/attaches the Slurm
# # job, sets up a forward from the login node to the compute container, and
# # prints `host:port` (optionally prefixed with ENDPOINT) on stdout.  The
# # gateway forwards that endpoint over the same connection.
# provision_command = ["/home/USER/.config/computeMCP-gateway/rosi5-provision.sh"]
# provision_timeout = 900.0
# # `target-connect`/`target-refresh` wait for provision_timeout plus a short
# # handshake margin, so this value also bounds the operator CLI wait.  Pass
# # `--timeout SECONDS` to the CLI to override it for one call.
# # Symmetric to provision_command: a trusted argv (no shell) that runs ON THE
# # remote machine over the live route connection to release the allocation
# # (e.g. scancel the Slurm job).  It runs on an explicit target/kill stop,
# # gateway shutdown and before a refresh; it does NOT run when a config reload
# # removes a target.  Non-zero exit or timeout is advisory.
# close_command = ["scancel", "--name", "terok-dev"]
# close_command_timeout = 120.0

# A target reachable without a tunnel (e.g. gateway co-located with the
# container, or the dev-hal test setup in this repository).
[targets.hal-direct]
transport = "direct"
remote_host = "host.containers.internal"
remote_port = 2222
user = "agent"
known_hosts = "/home/USER/.ssh/known_hosts"
client_key = "/home/USER/.ssh/terok_hal_task"

[targets.fwk394]
ssh_targets = ["fwk394", "ex_fwk394"]
remote_host = "127.0.0.1"
remote_port = 2222
user = "agent"
host_key_sha256 = "SHA256:REPLACE_WITH_CONTAINER_HOST_KEY_FINGERPRINT"
client_key = "/home/USER/.ssh/computemcp_container"

# Optional recovery: run a trusted command ON THE REMOTE HOST when the container
# cannot be reached (e.g. the Docker container is stopped). It does NOT change
# the endpoint (that is provision_command's job); it is meant to bring the
# container back up.  The command runs ON the remote machine over the
# authenticated route connection (no separate ssh -T).  The gateway re-probes
# after it exits.
#
#   connect_command_mode = "on_failure"  run only when the container is
#                                        unreachable (default; a healthy
#                                        container never pays for it)
#   connect_command_mode = "always"      run before every connect; the script
#                                        MUST be a no-op when already running
#
# The reference script scripts/ensure-container.sh starts the stopped container
# and is a no-op when it already runs.
#
# connect_command = ["/home/USER/.config/computeMCP-gateway/ensure-container.sh"]
# connect_command_timeout = 120.0
# connect_command_mode = "on_failure"

# A target with many simultaneous long-running sessions can opt out of the
# remote sshd's per-connection MaxSessions limit.
# [targets.gpu03]
# ssh_targets = ["gpu03"]
# remote_host = "127.0.0.1"
# remote_port = 2222
# user = "agent"
# connect_mode = "dedicated"
# host_key_sha256 = "SHA256:..."
# client_key = "/home/USER/.ssh/computemcp_container"

# ---------------------------------------------------------------------------
# Slurm target: Apptainer container inside the allocation
#
# A Slurm-allocation target that uses the shipped provisioning bundle.  The
# gateway computes the resource plan on the host, renders the per-stage Slurm
# arguments, and exports them as COMPUTEMCP_SBATCH_ARGS / COMPUTEMCP_SRUN_ARGS
# (and the plan/container variables) around the provisioning command.
#
# With a [targets.X.bundle] block the gateway deploys the bundle itself.  It
# opens the route connection, uploads the four helper files into deploy-dir over
# SFTP only when the remote content marker differs, derives the container's
# authorized public key from client_key, and runs the deployed helper.  The
# copy is versioned: after a gateway upgrade the changed bundle is re-deployed
# on the next connect.  The deploy directory must be on storage visible to the
# login AND compute nodes (the batch step runs the container script there), so
# it defaults to <container.storage-root>/bundle; /tmp is not shared on most
# clusters and is a poor choice.
#
# Without a [bundle] block, set provision_command/close_command yourself and
# place the bundle on the target by hand, as before.
#
# The bundle is config-driven: it builds the sandbox if missing, submits a
# single-node allocation, starts the container, and runs a relay from the
# login node to the container SSH port on the compute node.
#
# Multi-node allocations are not yet end-to-end: the gateway-side plan,
# mappings, and preview are live for nodes > 1, and the rendered args carry
# --nodes=N, but the helper exits with "multi-node not yet supported" before
# sbatch when the request has more than one node.  Use nodes = 1 until the
# container-startup path lands in a later change.
# ---------------------------------------------------------------------------
# [targets.rosi]
# ssh_targets = ["rosi"]                # login-node alias
# user = "agent"
# client_key = "/home/USER/.ssh/computemcp_container"
# host_key_sha256 = "SHA256:REPLACE_WITH_CONTAINER_HOST_KEY_FINGERPRINT"
# host_key_algorithms = ["ssh-ed25519"]
# sharing = "exclusive"                 # a whole Slurm allocation is ours
# auto_connect = true
# # The operator CLI wait for connect/refresh is provision_timeout + margin.
# provision_timeout = 960.0
#
# # Let the gateway deploy and run the shipped bundle.  deploy-dir is optional
# # and defaults to <container.storage-root>/bundle.  auto-deploy = true
# # (default) uploads when the content marker differs; set it to false to pin
# # the copy already deployed on the login node, even after a gateway upgrade.
# # provision-env is an optional array of shell lines run on the remote before
# # the container runtime is used (once on the login/route node before build and
# # again inside the container-start path on the job node); an empty array is a
# # no-op.  With a bundle block, provision_command is not required.
# [targets.rosi.bundle]
# source = "computemcp-container"
# # deploy-dir = "/scratch/USER/computemcp/bundle"
# # auto-deploy = true
# # provision-env = ["module load apptainer", "source /etc/profile.d/spack.sh"]
#
# # Allocatable resources of one compute node (descriptions, not constraints;
# # all fields are optional).  cpus are Slurm CPUs under the site/SMT policy,
# # gpus are the scheduler-visible GPU units, memory is allocatable host memory
# # with a Slurm unit (a bare integer is MiB).  Not installed RAM, not GPU memory.
# [targets.rosi.node]
# cpus = 24
# gpus = 4
# memory = "378000M"
#
# # Allocation policy.  One node is the default; a GPU system requests one
# # GPU per node (default-gpus is accepted; currently the mode fixes the count).
# # `single-node` takes
# # any of gpu-proportional | cpu-proportional | full | exclusive; `multi-node`
# # is limited to full | exclusive.  max-nodes is the hard bound on the request.
# [targets.rosi.allocation]
# default-gpus = 1
# single-node = "gpu-proportional"
# multi-node = "exclusive"
# max-nodes = 4
#
# # Manual submission options.  Keys are Slurm option names without leading --;
# # values are a string/integer (rendered --key=value), a boolean (true emits
# # --key, false omits) or an array (repeated --key=value).  Protocol options
# # the helper owns (parsable, quiet, wrap) are rejected here.
# # The dedicated `account` key is the scheduler account passed as
# # `sbatch -A`/`--account`; an empty string or an omitted key emits no
# # --account argument at all.
# [targets.rosi.slurm.sbatch]
# partition = "REPLACE_WITH_PARTITION_NAME"   # nested table under [slurm]
# time = "02:00:00"
# account = "REPLACE_WITH_ACCOUNT"            # omitted -> no -A/--account
# mem = "100G"           # fixed memory; when a manual option is present the
#                        # memory-per-node mapping is refused (conflict error)
# ntasks-per-node = 1    # = 1 so the cpus-per-task mapping below is valid
#
# # Calculated values -> scheduler options.  Keys are the calculated fields
# # (nodes, gpus-per-node, cpus-per-node, memory-per-node, exclusive) and the
# # value selects the representation.  gpus-per-node maps to gres or
# # gpus-per-node; cpus-per-node maps to cpus-per-task (one task per node only);
# # memory-per-node maps to mem (whole MiB, M unit); exclusive maps to exclusive
# # (emitted only when the plan is exclusive).  Omit a mapping to leave the
# # scheduler default.  The `sbatch`/`srun` stages are rendered independently;
# # nothing is copied between them.
# [targets.rosi.slurm.sbatch-map]
# nodes = "nodes"
# gpus-per-node = "gres"
# cpus-per-node = "cpus-per-task"
# exclusive = "exclusive"
# # No memory mapping: the manual mem option above is authoritative.
#
# # Manual job-step options and their mappings (independent from sbatch).
# [targets.rosi.slurm.srun]
# ntasks-per-node = 1
# cpu-bind = "none"
#
# [targets.rosi.slurm.srun-map]
# nodes = "nodes"
# cpus-per-node = "cpus-per-task"
#
# # Container runtime for the provisioning bundle. `runtime` is apptainer or
# # docker. `storage-root` is the base for the sandbox, home, and state dirs;
# # the bundle default is $HOME/.local/share/computemcp. `image` is the base
# # (docker://<ref> for Apptainer, plain reference for Docker). `gpus` is a
# # vendor list (subset of nvidia, amd, intel). `host-home` is the host dir whose
# # .ssh/authorized_keys the container trusts. `sandbox` is informational.
# [targets.rosi.container]
# runtime = "apptainer"
# storage-root = "/scratch/USER/computemcp"
# image = "docker://ubuntu:24.04"
# gpus = ["nvidia"]
# host-home = "/scratch/USER/computemcp/home"
# sandbox = true
#
# # Operator preview of the allocation without connecting:
# #   computeMCP-gatewayctl target-connect rosi --set gpus-per-node=2 --dry-run
# # The preview prints the plan, per-stage manual options, the rendered
# # per-stage arguments, the fields not emitted, and the final
# # COMPUTEMCP_SBATCH_ARGS / COMPUTEMCP_SRUN_ARGS.

# ---------------------------------------------------------------------------
# Slurm target: CPU-only node with a Docker container
#
# No GPUs on the node, so the target uses cpu-proportional (request the full
# per-node CPU capacity by default; default-cpus applies when node.cpus is
# unset) and lets the cpus-per-node / memory-per-node mappings emit the CPU
# and memory requests.  The container runtime is Docker and `gpus` is empty,
# so the helper adds no GPU device flags.
# ---------------------------------------------------------------------------
# [targets.cpuhost]
# ssh_targets = ["cpuhost"]
# user = "agent"
# client_key = "/home/USER/.ssh/computemcp_container"
# host_key_sha256 = "SHA256:REPLACE_WITH_CONTAINER_HOST_KEY_FINGERPRINT"
# host_key_algorithms = ["ssh-ed25519"]
# auto_connect = false
# provision_timeout = 600.0
#
# [targets.cpuhost.bundle]
# source = "computemcp-container"
# # deploy-dir = "/scratch/USER/computemcp/bundle"
#
# [targets.cpuhost.node]
# cpus = 16
# memory = "128G"
# # No `gpus` key: the node is CPU-only.
#
# [targets.cpuhost.allocation]
# default-cpus = 4
# single-node = "cpu-proportional"
#
# [targets.cpuhost.slurm.sbatch]
# partition = "REPLACE_WITH_PARTITION_NAME"
# time = "01:00:00"
# account = "REPLACE_WITH_ACCOUNT"      # empty/omitted -> no --account
# ntasks-per-node = 1
#
# [targets.cpuhost.slurm.sbatch-map]
# cpus-per-node = "cpus-per-task"      # one task per node (ntasks-per-node = 1)
# memory-per-node = "mem"              # emit --mem=<MiB>M from the plan
#
# [targets.cpuhost.slurm.srun]
# ntasks-per-node = 1
# cpu-bind = "none"
#
# [targets.cpuhost.slurm.srun-map]
# cpus-per-node = "cpus-per-task"
#
# [targets.cpuhost.container]
# runtime = "docker"
# storage-root = "/scratch/USER/computemcp"
# image = "ubuntu:24.04"               # plain reference for the Docker path
# # `gpus` unset: no GPU vendor is exposed, so the helper adds no device flags.

# ---------------------------------------------------------------------------
# Non-Slurm target: a Docker host that uses the provisioning bundle
#
# The shipped bundle is not Slurm-specific: on a host without a scheduler the
# helper skips sbatch/srun, builds or reuses the container on the route node,
# and starts it there.  There is no node/allocation/slurm block, and
# provision_command is not required: a [targets.X.bundle] block supplies the
# provisioning path.  provision-env runs the site setup before the runtime is
# used.
# ---------------------------------------------------------------------------
# [targets.hal-docker]
# ssh_targets = ["hal"]                 # a plain SSH route, no scheduler
# user = "agent"
# client_key = "/home/USER/.ssh/computemcp_container"
# host_key_sha256 = "SHA256:REPLACE_WITH_CONTAINER_HOST_KEY_FINGERPRINT"
# host_key_algorithms = ["ssh-ed25519"]
# auto_connect = true
#
# [targets.hal-docker.bundle]
# source = "computemcp-container"
# deploy-dir = "$HOME/computemcp/bundle"
# # provision-env = ["source /etc/profile.d/docker.sh"]
#
# [targets.hal-docker.container]
# runtime = "docker"
# storage-root = "/scratch/USER/computemcp"
# image = "ubuntu:24.04"
# gpus = ["nvidia"]

# ---------------------------------------------------------------------------
# Copy-paste skeleton blocks for a Slurm target.
#
# The blocks below are commented-out but valid TOML once the leading `# ` is
# removed.  They are the same keys the loader validates; no key here is
# invented.  Replace X with a real target name, set the string values, then
# delete the blocks you do not need.  `bundle` needs `client_key` (on the
# target) and, unless `deploy-dir` is set, a `container.storage-root` to
# derive the deployment directory from.  `node`/`allocation`/`slurm` are all
# optional; without them a target is a plain container host.
# ---------------------------------------------------------------------------
# [targets.X.bundle]
# source = "computemcp-container"
# deploy-dir = "/scratch/USER/computemcp/bundle"
# auto-deploy = true
# provision-env = ["module load apptainer", "source /etc/profile.d/spack.sh"]
#
# [targets.X.container]
# runtime = "apptainer"
# storage-root = "/scratch/USER/computemcp"
# image = "docker://ubuntu:24.04"
# gpus = ["nvidia"]
# host-home = "/scratch/USER/computemcp/home"
# sandbox = true
#
# [targets.X.node]
# cpus = 24
# gpus = 4
# memory = "378000M"
#
# [targets.X.allocation]
# default-gpus = 1
# default-cpus = 4
# single-node = "gpu-proportional"
# multi-node = "exclusive"
# max-nodes = 4
#
# [targets.X.slurm.sbatch]
# partition = "REPLACE_WITH_PARTITION_NAME"
# time = "02:00:00"
# account = "REPLACE_WITH_ACCOUNT"      # empty/omitted -> no --account
# ntasks-per-node = 1
#
# [targets.X.slurm.sbatch-map]
# nodes = "nodes"
# gpus-per-node = "gres"
# cpus-per-node = "cpus-per-task"

